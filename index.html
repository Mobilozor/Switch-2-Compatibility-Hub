  if(f.dev.some(t=>d.tags.includes(t))){s+=4;why.push("ciblé "+d.short)}
  if(g){if(f.games.includes(g)){s+=4;why.push("travaille sur "+GAMES[g])}else if(f.games.length)s-=1}
  if(f.build==="source"){s-=2;warn.push("à compiler depuis les sources")}
  if(os==="linux"&&f.linuxAsset)why.push("AppImage Linux fournie");
  if(f.dlss&&d.vendor==="nvidia")why.push("DLSS");
  if(f.fsr4&&d.vendor==="amd")why.push(d.arch==="rdna4"?"FSR 4 utilisable":"FSR 3.1 + frame gen (FSR 4 = RDNA4 seulement)");
  if(f.id==="ally"&&!d.avx512)warn.push("prendre l’édition AVX2");
  if(f.id==="deckoled"||f.id==="deckfork")warn.push("builds de test, pas stables");
  if(d.arch==="rdna2"&&f.id==="superbuild")why.push("fix crash RDNA2 (#657)");
  if(d.arch==="gtx"||d.arch==="gcn"){warn.push("GPU ancien : compatibilité Vulkan/mesh shaders limitée")}
  return{f,s,why,warn};
}
function tips(){
  const d=dev(),t=[...d.tips];
  if(S.os==="linux"){t.push("AppImage : glibc 2.39 ou plus requis (vérifie avec <code>ldd --version</code>), puis <code>chmod +x</code>. Jamais l’aarch64 sur x86.");
    if(d.vendor==="amd")t.push("Si OoT plante après la première cinématique sur APU AMD Linux : <code>EDEN_NX2_FORCE_MESH_FALLBACK=1 ./lichii…AppImage</code> (issue Lichii #871).")}
  if(d.arch==="rdna2")t.push("RDNA2 : le Superbuild embarque un fix de crash des matrices coopératives émulées (#657).");
  if(d.arch==="rdna4")t.push("RDNA4 : FSR 4 disponible (CheezyEmu, Lichii pour OoT).");
  else if(d.vendor==="amd"&&d.group!=="Consoles et handhelds")t.push("FSR 4 est réservé à RDNA4 ; ailleurs FSR 3.1 + frame generation.");
  if(d.vendor==="nvidia"&&d.arch==="rtx")t.push("RTX : DLSS 4.5 (Lichii, Fritchii, Superbuild).");
  if(d.ram&&d.ram<=16&&d.group==="Consoles et handhelds"&&d.vendor==="amd")t.push("16 Go de RAM unifiée : serré, car la RAM invité Switch 2 se compte en dizaines de Gio ; préfère les builds qui la libèrent (Superbuild, Nolar, Eglantine-steamdeck).");
  if(d.avx512&&d.group==="Consoles et handhelds")t.push("CPU avec AVX-512 : édition AVX-512 de Lichii Ally si tu es sous Windows.");
  $("#tips").innerHTML=t.length?`<div class="tip"><b>À savoir pour cet appareil</b><ul>${t.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"";
}
function card(r,i){
  const f=r.f,rel=f.release,lv=f.live,stars=f.stars!=null?f.stars:f.snap.stars,ver=rel?rel.name:f.snap.ver;
  return`<div class="card${i<1?" top":""}"><h3>${i<1?'<span class="b r">Recommandé</span> ':i<3?'<span class="b g">Alternative</span> ':""}<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a></h3>
  ${f.os.map(o=>`<span class="b">${OS[o]}</span>`).join("")}${f.vendor.filter(v=>v!=="any").map(v=>`<span class="b">${VN[v]}</span>`).join("")}${f.games.map(g=>`<span class="b">${GAMES[g]}</span>`).join("")}
  <div>${esc(f.note)}</div>
  ${r.why.length||r.warn.length?`<div class="why">${r.why.map(x=>`<span style="color:var(--ok)">✓ ${esc(x)}</span>`).join("")}${r.warn.map(x=>`<span style="color:var(--ac)">⚠ ${esc(x)}</span>`).join("")}</div>`:""}
  <div class="meta">${[ver?"version "+esc(ver):"",st(stars),lv&&f.pushed?"push "+ago(f.pushed):"",lv?"stats live":f.snap.date?"snapshot "+f.snap.date:""].filter(Boolean).join(" · ")}</div></div>`;
}
function rank(){
  const d=dev(),res=D.forks.map(f=>ev(f,d,S.os,S.game));
  const ok=res.filter(r=>!r.no).sort((a,b)=>b.s-a.s),no=res.filter(r=>r.no);
  $("#rank").innerHTML=ok.length?ok.slice(0,5).map(card).join("")+(ok.length>5?`<details><summary>${ok.length-5} autres forks compatibles</summary>${ok.slice(5).map((r,i)=>card(r,9)).join("")}</details>`:""):'<div class="empty">Aucun fork pour ce système.</div>';
  if(no.length)$("#rank").innerHTML+=`<details><summary>${no.length} forks non compatibles avec ${OS[S.os]}</summary>${no.map(r=>`<div class="meta">• <a href="${esc(r.f.url)}" target="_blank" rel="noopener">${esc(r.f.name)}</a> : ${r.no}</div>`).join("")}</details>`;
}
function aux(){
  $("#tabs").innerHTML=[["all","Tous les forks"],["prs","Pull requests"],["found","Découverts et micro-forks"]].map(([k,v])=>`<button class="tab${S.tab===k?" on":""}" data-t="${k}">${v}</button>`).join("");
  const q=S.q.toLowerCase(),search=`<input type="search" id="q" placeholder="Rechercher…" value="${esc(S.q)}">`;let h="";
  if(S.tab==="all"){
    h=search+D.forks.filter(f=>!q||(f.name+f.note+f.repo).toLowerCase().includes(q)).sort((a,b)=>(b.stars||b.snap.stars||0)-(a.stars||a.snap.stars||0)).map(f=>card({f,why:[],warn:f.build==="source"?["à compiler"]:[]},9)).join("");
  }else if(S.tab==="prs"){
    const K=["AMD","RADV","Linux","Steam Deck","SteamOS","Ally","FSR","Vulkan"];
    h=search+`<div class="chips">${K.map(k=>`<button class="chip${S.sel.has(k)?" on":""}" data-c="${k}">${k}</button>`).join("")}</div>`+
    (D.prs.filter(p=>[...S.sel].every(k=>p.kw.includes(k))&&(!q||(p.title+p.repo+p.user).toLowerCase().includes(q))).map(p=>`<div class="card"><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
    <span class="b ${p.state==="merged"?"g":p.state==="open"?"w":""}">${p.state==="merged"?"fusionnée":p.state==="open"?"ouverte":"fermée"}</span>${p.kw.map(k=>`<span class="b">${esc(k)}</span>`).join("")}
    <div class="meta">${esc(p.repo)} #${p.n} · ${esc(p.user)} · ${ago(p.updated)}</div></div>`).join("")||'<div class="empty">Aucune PR avec ces filtres.</div>');
  }else{
    h=(D.found.length?D.found.map(f=>`<div class="card"><h3><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.repo)}</a></h3>${f.kw.map(k=>`<span class="b">${esc(k)}</span>`).join("")}<div>${esc(f.desc)}</div><div class="meta">${st(f.stars)} · push ${ago(f.pushed)} · fork de ${esc(f.from)}</div></div>`).join(""):'<div class="tip">La découverte automatique des forks actifs demande l’API GitHub : lance <code>python3 update_forks.py</code> sur ta machine pour la remplir.</div>')+
    `<h2>Micro-forks repérés</h2>`+D.micro.map(m=>`<div class="meta">• ${esc(m[0])} : ${esc(m[1])}</div>`).join("");
  }
  $("#aux").innerHTML=h;
}
function all(){tips();rank();aux()}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-o]"),t=e.target.closest("[data-t]"),c=e.target.closest("[data-c]");
  if(o){S.os=o.dataset.o;osbar();all()}else if(t){S.tab=t.dataset.t;S.sel=new Set();aux()}else if(c){S.sel.has(c.dataset.c)?S.sel.delete(c.dataset.c):S.sel.add(c.dataset.c);aux()}
});
function osbar(){$("#os").innerHTML=dev().os.map(o=>`<button class="chip${S.os===o?" on":""}" data-o="${o}">${OS[o]}</button>`).join("")}
$("#dev").addEventListener("change",e=>{S.dev=e.target.value;const d=dev();if(!d.os.includes(S.os))S.os=d.os.includes("linux")?"linux":d.os[0];osbar();all()});
$("#game").addEventListener("change",e=>{S.game=e.target.value;rank()});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;aux();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
init();osbar();all();
</script></body></html>
